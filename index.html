<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/pwa-192x192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="mask-icon" href="/masked-icon.svg" color="#059669">
  <!-- No maximum-scale / user-scalable=no: / is now a text-heavy page read by
       adults, and blocking pinch-zoom on it fails WCAG 1.4.4 for exactly the
       parents this page has to convince. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" />
  <title>LexiaCamer — a reading app for children in Cameroon</title>
  <meta name="description"
        content="LexiaCamer teaches children to read in English — letter sounds and spelling. The app is in English and French so a parent can help. Free, works offline, no account. An early prototype, and we say plainly what is not finished yet." />

  <!-- Open Graph. This is what a parent sees when the link is pasted into a
       Facebook post or a WhatsApp message, which is how almost everyone
       currently arrives. Without these it renders as an untitled grey box,
       which is the worst possible first impression for a product whose whole
       pitch is that it is trustworthy.
       NOTE: og:url and og:image must be absolute, so they name the current
       Vercel deployment. Change both when the real domain is bought. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LexiaCamer" />
  <meta property="og:title" content="Your child can learn to read in English, even with no internet." />
  <meta property="og:description"
        content="English letter sounds and spelling, with the app itself in English and French so you can help. Free while we build, no account, works offline. Built for Cameroon." />
  <meta property="og:url" content="https://lexiacamer.vercel.app/" />
  <meta property="og:image" content="https://lexiacamer.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"
        content="LexiaCamer: your child can learn to read, even with no internet." />
  <meta property="og:locale" content="en_GB" />
  <meta property="og:locale:alternate" content="fr_FR" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Your child can learn to read in English, even with no internet." />
  <meta name="twitter:description"
        content="English letter sounds and spelling, with a French interface so you can help. Free while we build, works offline. Built for Cameroon." />
  <meta name="twitter:image" content="https://lexiacamer.vercel.app/og-image.png" />
  <!-- Fonts are served from this origin (see the @font-face block in
       index.css). Preloaded so the download starts with the stylesheet rather
       than after it, which on a weak connection saves a round trip. -->
  <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "LexiaCamer",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Any, via a web browser",
      "url": "https://lexiacamer.vercel.app/",
      "inLanguage": ["en", "fr"],
      "description": "A reading app for children in Cameroon. Teaches English letter sounds and spelling, with an English and French interface, and works offline.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "XAF" }
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
